[package]
name = "radar_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "radar_rs"
crate-type = ["cdylib"]

[features]
default = []
win-sensor = ["dep:windows"]

[dependencies]
pyo3 = { version = "0.24", features = ["extension-module"] }
numpy = "0.24"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", optional = true, features = ["Devices_Sensors", "Foundation"] }
